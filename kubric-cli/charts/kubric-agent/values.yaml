agent:
  clusterName: ""
  # Must be the FULL backend ingest path. Override with your Railway URL at install:
  #   --set agent.ingestionEndpoint=https://<your-railway-backend>/api/v1/ingest
  ingestionEndpoint: "https://api.kubric.dev/api/v1/ingest"
  token: ""
  image:
    repository: rookie12345/kubric-agent
    tag: "v5"
    pullPolicy: IfNotPresent

resources:
  requests:
    cpu: "10m"
    memory: "64Mi"
  limits:
    cpu: "100m"
    memory: "256Mi"

# Scheduling — the agent is a single lightweight pod that just needs to land
# somewhere. By default it tolerates any node taint so it schedules on clusters
# whose nodes are tainted (common on EKS/managed node groups). Override to pin
# it to specific nodes.
tolerations:
  - operator: Exists

nodeSelector: {}

affinity: {}
