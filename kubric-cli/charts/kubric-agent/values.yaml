agent:
  clusterName: ""
  # Must be the FULL backend ingest path. Override with your Railway URL at install:
  #   --set agent.ingestionEndpoint=https://<your-railway-backend>/api/v1/ingest
  ingestionEndpoint: "https://api.kubric.dev/api/v1/ingest"
  token: ""
  image:
    repository: rookie12345/kubric-agent
    tag: "v5"
    pullPolicy: IfNotPresent

resources:
  requests:
    cpu: "10m"
    memory: "64Mi"
  limits:
    cpu: "100m"
    memory: "256Mi"
