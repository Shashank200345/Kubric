apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubric-agent
  namespace: kubric-system
  labels:
    {{- include "kubric-agent.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubric-agent
  template:
    metadata:
      labels:
        app: kubric-agent
    spec:
      serviceAccountName: kubric-agent
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kubric-agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          env:
            - name: CLUSTER_NAME
              value: "{{ .Values.agent.clusterName }}"
            - name: INGESTION_ENDPOINT
              value: "{{ .Values.agent.ingestionEndpoint }}"
            - name: CLUSTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kubric-agent-credentials
                  key: clusterToken
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "test $(($(date +%s) - $(stat -c %Y /tmp/kubric-heartbeat 2>/dev/null || echo 0))) -lt 60"
            initialDelaySeconds: 10
            periodSeconds: 15
