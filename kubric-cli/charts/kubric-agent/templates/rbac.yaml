apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubric-agent
  namespace: kubric-system
  labels:
    {{- include "kubric-agent.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubric-agent-role
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "nodes", "services", "namespaces", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubric-agent-rolebinding
subjects:
  - kind: ServiceAccount
    name: kubric-agent
    namespace: kubric-system
roleRef:
  kind: ClusterRole
  name: kubric-agent-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubric-agent-actions
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubric-agent-actions-binding
subjects:
  - kind: ServiceAccount
    name: kubric-agent
    namespace: kubric-system
roleRef:
  kind: ClusterRole
  name: kubric-agent-actions
  apiGroup: rbac.authorization.k8s.io
