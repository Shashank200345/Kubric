apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oom-demo
  template:
    metadata:
      labels:
        app: oom-demo
    spec:
      containers:
      - name: stress
        image: polinux/stress
        command: ["stress", "--vm", "1", "--vm-bytes", "64M"]
        resources:
          requests:
            memory: "5Mi"
          limits:
            memory: "5Mi"
