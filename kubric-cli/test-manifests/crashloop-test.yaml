apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-test
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashloop-test
  template:
    metadata:
      labels:
        app: crashloop-test
    spec:
      containers:
        - name: crashloop-test
          image: busybox
          command: ["sh", "-c", "exit 1"]   # always exits non-zero → CrashLoopBackOff
