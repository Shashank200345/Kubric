apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-test
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oom-test
  template:
    metadata:
      labels:
        app: oom-test
    spec:
      containers:
        - name: oom-test
          image: polinux/stress
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "150M", "--vm-hang", "1"]
          resources:
            limits:
              memory: "50Mi"   # deliberately far below what stress will try to use → triggers OOMKill
