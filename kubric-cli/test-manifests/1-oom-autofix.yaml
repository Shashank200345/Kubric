# Scenario 1: OOMKilled -> update_resource_limits
# Deploy:  kubectl apply -f 1-oom-autofix.yaml
# Cleanup: kubectl delete -f 1-oom-autofix.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: kubric-fix-tests
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-autofix
  namespace: kubric-fix-tests
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oom-autofix
  template:
    metadata:
      labels:
        app: oom-autofix
    spec:
      containers:
        - name: app
          image: polinux/stress
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "150M", "--vm-hang", "1"]
          resources:
            requests:
              memory: "50Mi"
            limits:
              memory: "50Mi"
